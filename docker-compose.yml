version: '3.8'

services:
  # Relational Database Service (PostgreSQL)
  postgres_db:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: healthcare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Machine Learning Decision Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: healthcare_backend
    restart: always
    depends_on:
      postgres_db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres_db:5432/healthcare_db
      SECRET_KEY: docker-production-super-secret-key-decision-platform-2026
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"

  # React Frontend Single Page Application
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: healthcare_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
